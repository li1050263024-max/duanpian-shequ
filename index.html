<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短篇社区</title>
<style>
  :root {
    --stage: #e7e7ea;
    --blue: #3b86e8;
    --blue-2: #5aa0f0;
    --ink: #222;
    --muted: #8d8d8d;
    --line: #f0f0f0;
    --bg: #f6f7f9;
    --card: #fff;
    --orange: #ff8a1e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    background: var(--stage);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .panel { width: 248px; flex: none; background: #fff; border-radius: 20px; padding: 18px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 6px; font-size: 18px; }
  .panel p { margin: 0 0 12px; color: #888; font-size: 12px; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  .tbtn { flex: 1; height: 36px; border-radius: 10px; border: 1px solid #e6e6e6; background: #fff; font-size: 13px; }
  .tbtn.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .tbtn.primary { width: 100%; margin-top: 8px; background: var(--blue); color: #fff; border-color: var(--blue); }
  .file-name { margin: 8px 0 0; min-height: 16px; font-size: 12px; color: #888; word-break: break-all; }
  .file-name.playing { color: var(--blue); }

  .device {
    position: relative; width: 390px; height: min(844px, calc(100vh - 32px)); min-height: 680px; flex: none;
    padding: 10px; border-radius: 46px; background: #111;
    box-shadow: 0 0 0 1px #2a2a2a, 0 24px 60px rgba(0,0,0,.28);
  }
  .device::before, .device::after { content: ""; position: absolute; width: 3px; background: #3a3a3a; }
  .device::before { left: -3px; top: 118px; height: 26px; border-radius: 2px 0 0 2px; box-shadow: 0 42px 0 #3a3a3a, 0 84px 0 #3a3a3a; }
  .device::after { right: -3px; top: 168px; height: 58px; border-radius: 0 2px 2px 0; }
  .screen {
    height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); position: relative;
    display: flex; flex-direction: column; color: var(--ink);
  }
  .screen.dark { color-scheme: dark; }
  .status { flex: none; height: 28px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 1px; font-size: 13px; font-weight: 650; background: #fff; }
  .status-left, .status-icons { display: flex; align-items: center; gap: 5px; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .scroller { flex: 1; overflow: auto; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { width: 0; height: 0; }

  .searchrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px 2px; }
  .search {
    margin: 8px 12px; height: 34px; border-radius: 17px; background: #fff; display: flex; align-items: center; gap: 6px;
    padding: 0 12px; color: #b0b0b0; font-size: 13px; border: 0; width: calc(100% - 24px);
  }
  .searchrow .search { margin: 0; width: auto; flex: 1; }
  .search .icon { width: 18px; height: 18px; border: 0; background: transparent; padding: 0; color: #b0b0b0; display: grid; place-items: center; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 13px; color: #333; }
  .search input::placeholder { color: #b0b0b0; }
  .reward { width: 46px; height: 46px; border: 2px solid #fff; border-radius: 50%; padding: 0; color: #8a4b00; font-size: 9px; font-weight: 800; line-height: 1.15; background: radial-gradient(circle at 40% 30%, #ffe9a8, #f0b030); box-shadow: 0 2px 8px rgba(210,150,30,.28); }
  .screen svg { width: 18px; height: 18px; flex: none; }
  .search svg { flex: none; }
  .screen.grad { background: linear-gradient(180deg, transparent 0 240px, #f7f8fa 520px), linear-gradient(102deg, #fef7ea 0%, #f6f3ee 42%, #e9f0f8 74%, #e6eefa 100%); }
  .screen.grad .topbar { background: transparent; }
  .screen.hpbg { background: #e4ebe8 url("assets/hp-bg.jpg") center / cover no-repeat; }
  .screen.hpbg .topbar, .screen.hpbg .taghead, .screen.hpbg .tabs3, .screen.hpbg .filters, .view.hp { background: transparent; }
  .screen.hpbg .search { background: rgba(255,255,255,.78); }
  .view.feed { background: transparent; }
  .art { position: relative; height: 176px; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; gap: 2px; }
  .art b { font-size: 20px; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .art span, .art small { font-size: 11px; opacity: .92; }
  .art.sky { height: 210px; background: linear-gradient(165deg, #9ec0ea 0%, #2a3d5c 46%, #141c28 100%); }
  .art.tide { height: 156px; background: linear-gradient(155deg, #7eb0ff 0%, #2a3a86 46%, #1a143c 100%); }
  .chips { display: flex; gap: 16px; padding: 4px 14px 12px; overflow: auto; scrollbar-width: none; font-size: 15px; color: #666; white-space: nowrap; }
  .chips::-webkit-scrollbar { height: 0; }
  .chips button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 15px; flex: none; position: relative; }
  .chips button.on { color: #111; font-weight: 750; }
  .chips button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 3px; border-radius: 2px; background: var(--blue); }
  .subchips { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px; overflow: hidden; }
  .subchips-scroll { display: flex; gap: 4px; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .subchips-scroll::-webkit-scrollbar { height: 0; }
  .subchips button { flex: none; height: 26px; padding: 0 8px; border: 0; border-radius: 13px; background: transparent; color: #888; font-size: 13px; white-space: nowrap; }
  .subchips button.on { background: #fff; color: #222; font-weight: 650; }
  .subchips .sort-pill { display: flex; flex: none; align-items: center; height: 26px; padding: 2px; border-radius: 13px; background: rgba(0,0,0,.06); }
  .subchips .sort-pill button { height: 22px; padding: 0 8px; border-radius: 11px; background: transparent; color: #8a8a8a; font-weight: 500; }
  .subchips .sort-pill button.on { background: #fff; color: #222; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .subchips > button[data-more] { flex: none; }

  .masonry { columns: 2; column-gap: 8px; padding: 0 10px 12px; }
  .card { break-inside: avoid; margin: 0 0 8px; background: #fff; border-radius: 10px; overflow: hidden; padding: 0; border: 0; text-align: left; width: 100%; color: inherit; display: block; }
  .card img.cover { width: 100%; height: 132px; object-fit: cover; display: block; background: #ddd; }
  .card img.cover.sky { height: 228px; }
  .card img.cover.tide { height: 158px; }
  .card img.cover.face { height: 230px; object-position: center 15%; }
  .view.hp .masonry .card img.cover { width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; }
  .card .pad { padding: 8px 8px 10px; }
  .card h3 { margin: 0; font-size: 13px; line-height: 1.35; font-weight: 700; }
  .card .excerpt { margin: 4px 0 0; color: #9a9a9a; font-size: 11px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .tag { height: 16px; padding: 0 6px; border-radius: 8px; background: #f2f3f5; color: #8aa4c8; font-size: 10px; line-height: 16px; }
  .meta { display: flex; align-items: center; gap: 4px; margin-top: 6px; color: #b0b0b0; font-size: 11px; }
  .ava { width: 16px; height: 16px; border-radius: 50%; background: #d8d8d8; flex: none; }
  .meta .num { margin-left: auto; display: flex; align-items: center; gap: 2px; }

  .bookrow { display: flex; gap: 10px; margin: 0 10px 8px; padding: 10px; background: #fff; border-radius: 12px; border: 0; width: calc(100% - 20px); text-align: left; color: inherit; }
  .bookrow img, .fake-cover { width: 72px; height: 96px; border-radius: 6px; object-fit: cover; flex: none; }
  .fake-cover { display: grid; place-items: end start; padding: 8px; color: #fff; font-weight: 750; font-size: 13px; line-height: 1.25; }
  .bookrow h3 { margin: 0; font-size: 15px; }
  .bookrow p { margin: 4px 0 0; color: #999; font-size: 12px; }
  .bookrow .sub { margin-top: 8px; color: #bbb; font-size: 11px; }

  .hot { break-inside: avoid; margin: 0 0 8px; background: #fff; border-radius: 10px; padding: 10px 8px 8px; }
  .hot h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .hot li { display: flex; gap: 4px; font-size: 11px; color: #444; line-height: 1.65; list-style: none; }
  .hot ol { margin: 0; padding: 0; }
  .hot .tip { margin: 6px 0 0; text-align: center; color: #c0c0c0; font-size: 10px; line-height: 1.4; }
  .hot .n { width: 14px; color: var(--orange); font-weight: 700; flex: none; }
  .hot .go { width: 100%; margin-top: 6px; height: 28px; border: 0; border-radius: 14px; background: #fff3e6; color: var(--orange); font-size: 12px; font-weight: 650; }

  .tabbar { flex: none; height: 56px; background: #fff; display: flex; border-top: 1px solid #f3f3f3; }
  .tabbar button { flex: 1; border: 0; background: transparent; color: #9a9a9a; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tabbar button.on { color: var(--blue); }
  .tabbar button:disabled { cursor: default; opacity: 1; color: #9a9a9a; }
  .tabbar button.on:disabled { color: var(--blue); }
  .screen .tabbar svg { width: 22px; height: 22px; }
  .screen .meta svg { width: 12px; height: 12px; }
  .screen .act svg { width: 20px; height: 20px; }
  .home-ind { width: 120px; height: 4px; border-radius: 3px; background: #111; margin: 0 auto 6px; flex: none; }

  .topbar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff; flex: none; }
  .topbar .icon { width: 32px; height: 32px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .topbar .spacer { flex: 1; }
  .topbar.feed-top { position: relative; justify-content: space-between; }
  .topbar.feed-top .seg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .feed-side { display: flex; align-items: center; }
  .seg { display: flex; gap: 18px; font-size: 16px; }
  .seg button { border: 0; background: transparent; color: #999; font-size: 16px; padding: 0; }
  .seg button.on { color: #111; font-weight: 750; }
  .follow { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid #ddd; background: #fff; font-size: 13px; }
  .follow.fill { background: var(--blue); color: #fff; border-color: var(--blue); }
  .follow.on { background: #222; color: #fff; border-color: #222; }
  .avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: #d5d5d5; }

  .fab { position: absolute; right: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--orange); color: #fff; font-size: 32px; line-height: 1; box-shadow: 0 8px 18px rgba(255,138,30,.35); z-index: 5; }

  .more-nav { background: #fff; }
  .sign-chip { position: relative; width: 44px; height: 44px; border: 0; border-radius: 22px; background: radial-gradient(circle at 40% 30%, #ffe9a8, #f0b030); color: #8a4b00; font-size: 11px; font-weight: 800; flex: none; }
  .sign-chip i { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: #ff4d4f; }
  .nav-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px; }
  .nav-h b { font-size: 16px; }
  .nav-h .links { display: flex; gap: 16px; }
  .nav-h button { border: 0; background: transparent; color: var(--blue); font-size: 14px; padding: 0; }
  .tag-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 8px; }
  .tag-grid button { height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: #f4f5f7; color: #666; font-size: 14px; }

  .view.shelf { background: linear-gradient(180deg, #f3f6fb 0%, #f7f8fa 180px, #fff 180px); }
  .shelf-top { justify-content: flex-start; gap: 16px; padding: 0 12px; background: transparent; }
  .shelf-top .seg { gap: 16px; }
  .shelf-sign { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 2px 16px 10px; }
  .shelf-sign .days { text-align: right; font-size: 12px; color: #999; line-height: 1.25; }
  .shelf-sign .days b { display: block; color: #222; font-size: 16px; }
  .sign-btn { height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--blue); color: #fff; font-size: 13px; }
  .sign-btn.on { background: #e8e8e8; color: #888; }
  .shelf-sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; border-radius: 16px 16px 0 0; }
  .shelf-filters { display: flex; align-items: center; gap: 18px; padding: 12px 16px 8px; }
  .shelf-filters > button { border: 0; background: transparent; color: #888; font-size: 15px; padding: 0 0 6px; position: relative; }
  .shelf-filters > button.on { color: #111; font-weight: 750; }
  .shelf-filters > button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: #111; }
  .shelf-filters .side { margin-left: auto; display: flex; gap: 8px; }
  .shelf-filters .side button { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid #eee; background: #fff; color: #888; font-size: 12px; }
  .shelf-book { display: flex; gap: 12px; width: 100%; border: 0; background: #fff; text-align: left; padding: 10px 16px; color: inherit; align-items: center; }
  .shelf-book .fake-cover { width: 64px; height: 86px; border-radius: 4px; display: grid; place-items: center; color: #fff; font-weight: 750; font-size: 13px; flex: none; }
  .shelf-book .info { min-width: 0; flex: 1; }
  .shelf-book h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .shelf-book .upd { display: inline-block; margin-left: 6px; background: #ff4d6a; color: #fff; font-size: 10px; line-height: 16px; border-radius: 3px; padding: 0 4px; vertical-align: 2px; font-style: normal; font-weight: 650; }
  .shelf-book p { margin: 4px 0 0; color: #999; font-size: 12px; }
  .shelf-book .dot { border: 0; background: transparent; color: #ccc; font-size: 18px; padding: 0 0 0 8px; }

  .draft-page { background: #f2f3f5; }
  .draft-page .topbar { background: #f2f3f5; }
  .draft-page .topbar h1 { flex: 1; text-align: center; font-size: 17px; font-weight: 650; }
  .draft-page .masonry { padding-top: 10px; }
  .draft-cap { margin-top: auto; flex: none; text-align: center; color: #c8c8c8; font-size: 12px; padding: 12px 0 20px; }

  .taghead { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; padding: 6px 16px 12px; }
  .taghead h2 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  .taghead .count { margin: 0; color: #999; font-size: 12px; flex: none; }
  .screen.hpbg .view.hp { background: linear-gradient(180deg, transparent 0 40px, rgba(223,227,234,.32) 86px, rgba(223,227,234,.7) 118px, #dfe3ea 156px, #e7ebf0 240px, #f2f3f5 430px, #f7f7f8 100%); }
  .view.hp .hp-sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; background: transparent; }
  .screen.hpbg .view.hp .tabs3, .screen.hpbg .view.hp .filters, .view.hp .scroller { background: transparent; }
  .tabs3 { display: flex; justify-content: space-around; background: #fff; font-size: 15px; color: #888; }
  .tabs3 button { border: 0; background: transparent; padding: 8px 0 10px; color: inherit; position: relative; font-size: 15px; }
  .tabs3 button.on { color: #111; font-weight: 750; }
  .tabs3 button.on::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 22px; height: 3px; margin-left: -11px; background: #111; border-radius: 2px; }
  .filters { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-size: 13px; color: #888; background: var(--bg); position: relative; }
  .filters button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 13px; }
  .filters button.on { color: #222; font-weight: 700; }
  .filters .sort-pill { display: flex; flex: none; align-items: center; height: 26px; padding: 2px; border-radius: 13px; background: rgba(255,255,255,.78); }
  .filters .sort-pill button { height: 22px; padding: 0 10px; border-radius: 11px; background: transparent; color: #8a8a8a; font-weight: 500; font-size: 13px; }
  .filters .sort-pill button.on { background: #fff; color: #222; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .filters .rank { margin-left: auto; }
  .popover { position: absolute; right: 12px; top: 32px; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 6; overflow: hidden; }
  .popover button { display: block; width: 88px; height: 36px; border: 0; background: #fff; font-size: 13px; }
  .popover button.on { color: var(--blue); }

  .reader { background: #fff; }
  .hero { position: relative; background: #ddd; }
  .hero img { width: 100%; height: 280px; object-fit: cover; object-position: center 20%; display: block; }
  .hero .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(transparent, #fff 78%); }
  .badge { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.45); color: #fff; font-size: 12px; border-radius: 10px; padding: 2px 8px; }
  .reader h2 { margin: 0; padding: 12px 16px 0; font-size: 18px; line-height: 1.4; }
  .hero h2 { position: absolute; left: 16px; right: 16px; bottom: 8px; padding: 0; z-index: 1; }
  .copy { padding: 8px 16px 0; color: #8a8a8a; font-size: 15px; line-height: 1.75; }
  .copy p { margin: 0 0 16px; }
  .lock { padding: 4px 16px 8px; }
  .lock-label { display: flex; align-items: center; gap: 10px; color: #ccc; font-size: 13px; margin-bottom: 12px; }
  .lock-label i { flex: 1; height: 1px; background: #eee; }
  .lock-actions { display: flex; gap: 10px; }
  .pill { flex: 1; height: 40px; border-radius: 20px; border: 0; font-size: 14px; }
  .pill.ghost { background: #e7f1fc; color: var(--blue); }
  .pill.solid { background: var(--blue); color: #fff; }
  .section-title { margin: 16px 16px 8px; font-size: 15px; }
  .rel { display: flex; gap: 10px; margin: 0 16px; padding: 10px; background: #f7f7f7; border-radius: 12px; border: 0; text-align: left; color: inherit; width: calc(100% - 32px); }
  .rel img { width: 64px; height: 86px; object-fit: cover; border-radius: 4px; }
  .rel .brief { margin: 0; font-size: 12px; color: #999; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rel .score { margin-top: 6px; font-size: 12px; color: #f5a623; }
  .comment { display: flex; gap: 8px; padding: 8px 16px; }
  .c-ava { width: 32px; height: 32px; border-radius: 50%; background: #ffd0dc; display: grid; place-items: center; color: #fff; font-size: 13px; flex: none; }
  .c-name { color: #bbb; font-size: 12px; }
  .c-text { font-size: 14px; margin-top: 2px; }
  .c-date { color: #ccc; font-size: 12px; margin-top: 4px; }
  .composer { flex: none; display: flex; align-items: stretch; gap: 4px; padding: 8px 6px 8px 12px; background: #fff; }
  .composer input { flex: 1; height: auto; align-self: stretch; border: 0; border-radius: 20px; background: #f3f3f3; padding: 0 14px; font-size: 13px; }
  .act { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #666; font-size: 11px; line-height: 1; padding: 0 2px; min-width: 40px; }
  .act svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .act.on.like { color: #ff4d4f; }
  .act.on.star { color: #f5a623; }
  .act.on svg { fill: currentColor; }

  .screen.dark .reader, .screen.dark .reader .composer, .screen.dark .status.darkbar { background: #000; color: #eee; }
  .screen.dark .reader h2, .screen.dark .reader .topbar, .screen.dark .reader .topbar h1 { color: #f3f3f3; background: #000; }
  .screen.dark .reader .copy { color: #c8c8c8; }
  .screen.dark .reader .hero .fade { background: linear-gradient(transparent, #000 78%); }
  .screen.dark .reader .follow { background: transparent; color: #eee; border-color: #666; }
  .screen.dark .reader .composer input { background: #222; color: #eee; }
  .screen.dark .reader .rel { background: #161616; }
  .screen.dark .reader .act { color: #ddd; }

  .mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; z-index: 21; padding-bottom: 8px; }

const ARTICLE = `你怕德拉科·马尔福。

这件事你没跟任何人说过。魔法部的人提起他，用的词都很体面：冷、挑剔、不好说话。战争结束七年，他早已不是霍格沃茨走廊里那个扬着下巴的少年，可纯血统的旧姓氏仍像一层薄冰，他走在上面，步子很稳，肩背始终挺直。你在魔法法律执行司的文书处抄写卷宗，今年二十四岁，偶尔要把文件送到他那一层。敲门，等那声很淡的“进来”，再把羊皮纸放在桌角。他的眼睛是浅灰色的，抬起来时像冬天的河面。你总在那一眼之前先低下头。

你以为他讨厌你。因为他从不寒暄。因为他会把你放歪的文件夹默默转正，指尖白而稳，像在纠正一件不够格的东西。有一次你在走廊遇见他，他停了一停，像要说话，最终只是侧身让路。皮鞋声远了，你才发现自己一直屏着呼吸。你把这些都理解成嫌弃。高傲的人连多看你一秒都吝啬。你这样告诉自己，然后尽量绕开他常走的那条楼梯。

德拉科并不知道你在躲到什么程度。他只知道自己每次看见你，舌尖会先发紧。你放下卷宗时，指尖会在桌沿停一下，留下很轻的温度。他等门掩上，才允许自己把那份文件拉近，看你抄写时习惯性收紧的字迹。墨水干得整齐，某个笔画却微微出头，像你匆忙里仍想把事情做好。他想过很多开口的方式。早啊。今天的茶还热。你不用走那么快。每一句都停在喉结里。马尔福不该显得急切。他一遍遍提醒自己，直到这句话变成一种拖延。

他的喜欢因此长得很慢，也藏得很深。你加班时他会“碰巧”留到同样的钟点，路过文书处，目光在你弯着的背上停两秒，又强迫自己走开。你打翻墨水瓶的那个下午，他比同事先一步挥了魔杖，污渍消失，他只说“小心”。你道谢时声音发颤，他便再不多留。他回到办公室，掌心还记得你惊惶看向他的那一眼。那一眼没有喜欢，只有怕。他恨自己从前造就的形象，却不知道怎么把壳拆开给你看。

改变发生在一个普通的周四。

中庭的光从玻璃顶落下来，你抱着一摞刚盖过章的许可状，被人从侧面叫住。科林·特纳，交通司的，比你大两岁，笑起来有酒窝，说话很慢，像生怕吓到你。“我喜欢你很久了。”他说，耳朵红着，“如果你愿意，这个周末可以一起喝杯茶。不勉强。你考虑一下也行。”

你愣住。手里的纸页微微发抖。你还没想好怎么回答，余光先看见了楼梯口的银白。

德拉科站在那里。他本来要下楼，一只手还搭在扶手上。他看见科林面对你的姿态，看见你怔住的侧脸，胸口像被什么狠狠攥了一下。那些他告诉自己“再等等”的日子忽然变得可笑。再等等，你就会坐在别人对面，把笑分给别人。他受不了这个画面。它比拒绝本身更先到来，也更让他失态。

他走下来的步子比平时快。科林朝他点头，他几乎没回。他在你身侧停下，声音压得很低，只有你听得见：“跟我来。就一会儿。”

你下意识退了半步。他看见了。眉心皱起来，又很快松开，像在强迫自己别再用那种会让你害怕的语气。“求你。”这两个字轻得不像他。

你跟着他走到中庭侧面的空廊。窗外是伦敦潮湿的天。他站得离你有一臂远，手指却握紧又松开，骨节微微发白。

“他跟你说什么了？”

“他约我喝茶。”

德拉科的喉结滚动了一下。他笑了一声，很短，没有笑意。“我该更早说的。”他看着你，灰色的眼睛里没有你熟悉的那层冰，只剩下一种几乎失态的认真，“我喜欢你。不是今天才喜欢。从你第一次把卷宗放到我桌上、又飞快逃走的那天就喜欢。你每次进来，我都想让你多留一会儿。可你总是逃。我不知道怎么靠近一个看见我就会害怕的人。我怕我一开口，你就再也不来了。”

风从廊柱间穿过去。你抱着文件，指节发白。他的耳朵红了，仍强迫自己把话说完。

“你不用现在回答。”声音低下去，带着一点你从没听过的软，“只要别这么快答应别人。给我一个机会。我会追你。用你能接受的方式。你怕的话，我就站远一点。你不想见我，我就只把茶放在门口。可你得知道，我不是一时兴起。”

你点了点头。自己也不知道在点什么。科林还在中庭里等。你后来只跟科林说了谢谢，周末没有茶。回到工位时，心跳仍乱。你反复想起德拉科说“求你”时低下去的眼睫。那样的人也会求人。这个事实轻轻撞开了你心里那层怕。

从那天起，他真的开始追你。

他不再只说“进来”。你送文件时，桌上会多一杯温度刚好的红茶，杯子推到你手边，他假装在看报告。“顺路泡的。”他说。你知道八楼的茶水间并不顺路。茶里放了一点蜂蜜，正好是你能接受的甜。你不知道他问过文书处的姑娘你喜欢什么，问的时候耳朵也红，还再三叮嘱对方别说是他问的。

他开始在傍晚等你。不进你的办公室，只站在走廊尽头，袍角被风吹起一角。“一起走去飞路网。”邀请永远像询问，句尾轻轻往上，“如果你愿意。”

你愿意的次数一天比一天多。起初你还是怕，怕他忽然恢复那种高傲的沉默，怕这只是他赢过别人的方式。可他把害怕这件事记得很清楚。人多的地方他不碰你。你皱眉时他会先退开半步，问“是不是太近了”。他给你带蜂蜜蛋糕，附一张纸条，字迹比他本人老实得多：今天的会议很烦。想到你可能会笑，就没那么烦了。

有一天下雨。你没带伞，站在正门檐下，看着地面的水洼发愁。黑伞忽然倾斜过来，罩住你，也罩住他肩头的一小块雨。他的袖口湿了，语气却稳：“我送你到飞路网。伞够两个人。如果你愿意靠过来一点的话。”

你靠过去。手臂隔着袍料轻轻相贴。他的呼吸明显乱了一拍，伞却举得很稳，一点雨都不让它落到你脸上。走到壁炉前，他没有进火焰。只把伞往你手里送，又在你抓住伞柄时没有立刻松开。四指相叠的那几秒里，他看着你，声音很轻：“今天也可以算我追到你了吗？”

你耳尖发热，点了点头。他这才松开，唇角慢慢弯起来。那个笑很浅，却没有半分对外人的矜持，像只做给你看。

你开始分得清他的冷。那不是对着你的。那是他不知怎么把喜欢说出口时，用来撑住自己的壳。壳一旦裂开，里面的人会因为你晚了十分钟而在飞路网旁边来回走。看见你出现，又立刻站直，装作只是刚好路过。

你问他：“你是在等我吗？”

他耳根红了，仍点头。“是。可以叫我德拉科。如果你愿意。”

你愿意。你开始叫他的名字时，他会沉默一两秒，像要把这两个字含在嘴里暖一暖，然后才答你。他追你的方式黏，却又小心。午休他把切好的苹果放在你桌上，自己坐在对面，看你吃掉第一片才肯动叉子。你说太甜，他把自己那份里偏酸的推给你，理所当然得像这是他的职责。同事从玻璃外经过，他恢复成那副淡淡的神情，膝盖却在桌下轻轻碰一下你的膝盖，仿佛在说：对外我仍是那样，对你不是。

醉的那一天，是交通司的小型庆功。你本不想去，科林也在。德拉科说“我陪你”，于是你去了。大厅里黄油啤酒和火焰威士忌混在一起。他平时克制，那晚却被几位旧识找上，一杯接一杯。你看见他推拒，看见他仍然喝了。他的脸颊慢慢泛起薄红，说话时尾音比白天长，看你的次数也比白天多。每一次视线落过来，都像在确认你还站在他能看见的地方。

你提前离席，到露台上吹风。伦敦的夜有一点冷。没多久，门被轻轻推开。德拉科走出来，步子慢，银发被风吹乱了一缕。他在你旁边停下，没有靠得很近，酒气却温热地漫过来。灰色的眼睛亮，又有些湿。

“你还在怕我吗？”他问。

你摇头。这次是真的。

“那就好。”他喃喃，手指抬起来，在离你脸颊一寸的地方停住，“我可以碰你吗？”

“可以。”

他的指腹贴上你的脸，很轻，像在确认你是真的。拇指慢慢蹭过你的颧骨，又舍不得离开。他靠近了一点，呼吸落在你唇边，声音哑哑的，几乎是恳求。

“亲我一下。或者让我亲你。求你了。”

你能感觉到他在抖。不是高傲，是怕你拒绝。醉意把他平时那些体面的句子都拆掉了，只剩下最直白的一句。他的额头几乎要碰到你的，仍留着最后一线距离，把选择放在你手里。

“我知道我喝了酒。”他又说，含糊，却认真，“你要是不愿意，就推开我。我明天会醒，会不好意思，可我还是会再问你一次。今晚这一下，我想要。很想。想了太久了。”

你没有退。你抬起手，揪住他礼服袍的前襟，让他低下头。这个吻很短，软，带着火焰威士忌淡淡的辛辣，和他小心翼翼不敢加深的克制。他发出一声模糊的鼻音，像终于把心放下来。唇分开时他没有走远，额头抵着你的额头，呼吸又热又乱。

“再一下。”他黏糊糊地贴着你说，“就一下。我保证不欺负你。你要是晕，我就只吻到这里。”

他说着，吻落在你的嘴角，轻得像问句。你没有推开。你偏过头，把第二个吻还给他。这次更慢。他笑了一下，尾音发颤，双手才敢环上你的腰，把你拢进怀里。下巴搁在你发顶，闷闷地重复：“我喜欢你。很喜欢。你别答应别人。茶我会继续泡。雨我也会继续送。你可以怕别人，别怕我。”

“我不答应别人。”你说，脸埋在他胸前，声音被袍料挡住，仍被他听清了。

他紧紧抱着你，像怕一松手，这个夜晚就会醒成一场他不敢再提的梦。露台的风很冷，他的手臂却热。你站在他怀里，忽然觉得从前那些让你害怕的沉默，不过是一个人喜欢到不知所措，却还是每天把红茶推到你手边，等你愿意靠近的那一天。

他后来又含含糊糊地索要了第三个吻，只落在你眉心。然后他把脸埋进你的颈窝，心满意足地哼了一声，像一只终于被允许粘人的猫。“记住了。”他小声说，“这是你给我的。明天我醒着，还要你再给一次。”`.trim().split(/\n\n+/);

function pad(n) { return String(n).padStart(2, "0"); }
function draftStamp(item) {
  const at = item.at || Date.now();
  const d = new Date(at);
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((start - day) / 86400000);
  const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (diff === 0) return "今天 " + hm;
  if (diff === 1) return "昨天 " + hm;
  return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
}
function formatCN(d) {
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toLocalValue(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

      <p class="hint">${hint}</p>
      <button type="button" class="text-btn" id="payOff">关闭付费</button>
      <div class="drawer-actions"><button type="button" id="payCancel">取消</button><button type="button" class="ok" id="payOk">确定</button></div>`;
    sheet.querySelectorAll("[data-pay]").forEach(btn => btn.addEventListener("click", () => {
      payMode = btn.dataset.pay;
      if (payMode === "coin" && payQty > 100) payQty = 100;
      paint();
    }));
    sheet.querySelectorAll("[data-step]").forEach(btn => btn.addEventListener("click", () => {
      const next = payQty + Number(btn.dataset.step);
      const limit = payMode === "coin" ? 100 : 9999;
      if (next > limit) { toast(payMode === "coin" ? "金币不得超过100" : "数量已达上限"); return; }
      if (next < 1) return;
      payQty = next;
      paint();
    }));
    sheet.querySelector("#payCancel").addEventListener("click", close);
    sheet.querySelector("#payOff").addEventListener("click", () => { setOptLabel("pay", "关闭"); close(); toast("已关闭付费解锁"); });
    sheet.querySelector("#payOk").addEventListener("click", () => {
      setOptLabel("pay", `${payMode === "coin" ? "金币" : "鲜花"} ${payQty}`);
      close();
      toast("已设置付费解锁");
    });
  };
  paint();
}
function openCollectionDrawer() {
  const { sheet, close } = mountDrawer();
  let view = "pick";
  let coverUrl = "";
  const sorted = () => collections.slice().sort((a, b) => b.at - a.at);
  const paint = () => {
    if (view === "create") {
      sheet.innerHTML = `<h3>创建合集</h3><div class="col-form">
        <input id="colName" maxlength="20" placeholder="合集名称（必填）">
        <textarea id="colIntro" maxlength="30" placeholder="合集介绍（选填，30字）"></textarea>
        <button type="button" class="cover-pick" id="colCover" ${coverUrl ? `style="background-image:url('${coverUrl}')"` : ""}>${coverUrl ? "" : "添加图片"}</button>
        <input id="colFile" type="file" accept="image/*" hidden>
      </div><div class="drawer-actions"><button type="button" id="colCancel">取消</button><button type="button" class="ok" id="colOk">确认创建</button></div>`;
      sheet.querySelector("#colCover").addEventListener("click", () => sheet.querySelector("#colFile").click());
      sheet.querySelector("#colFile").addEventListener("change", () => {
        const file = sheet.querySelector("#colFile").files[0];
        if (!file) return;
        const name = sheet.querySelector("#colName").value;
        const intro = sheet.querySelector("#colIntro").value;
        coverUrl = URL.createObjectURL(file);
        paint();
        const nameEl = sheet.querySelector("#colName");
        if (nameEl) { nameEl.value = name; sheet.querySelector("#colIntro").value = intro; }
      });
      sheet.querySelector("#colCancel").addEventListener("click", () => { coverUrl = ""; view = "manage"; paint(); });
      sheet.querySelector("#colOk").addEventListener("click", () => {
        const name = sheet.querySelector("#colName").value.trim();
        const intro = sheet.querySelector("#colIntro").value.trim();
        if (!name) { toast("请填写合集名称"); return; }
        if (collections.length >= 20) { toast("合集数量已达到上限"); return; }
        const item = { id: ++colSeq, name, intro, cover: coverUrl, at: Date.now() };
        collections.unshift(item);
        pickedCol = item.id;
        setOptLabel("collection", item.name);
        coverUrl = "";
        view = "pick";
        toast("创建成功");
        paint();
      });
      return;
    }
    const managing = view === "manage";
    const none = managing ? "" : `<button type="button" class="col-row${pickedCol === 0 ? " on" : ""}" data-pick="0"><span>不添加</span>${pickedCol === 0 ? `<i class="mark">✓</i>` : ""}</button>`;
    const rows = none + sorted().map(item => managing
      ? `<div class="col-row"><span>${esc(item.name)}</span><button type="button" class="del" data-del="${item.id}">删除</button></div>`
      : `<button type="button" class="col-row${pickedCol === item.id ? " on" : ""}" data-pick="${item.id}"><span>${esc(item.name)}</span>${pickedCol === item.id ? `<i class="mark">✓</i>` : ""}</button>`
    ).join("") || `<p class="hint">还没有合集</p>`;
    sheet.innerHTML = `<div class="drawer-head"><h3>${managing ? "管理合集" : "添加合集"}</h3>${managing ? `<button type="button" class="text-btn" id="colDone">完成</button>` : `<button type="button" class="text-btn" id="colManage">管理合集</button>`}</div>
      <div class="pick-list">${rows}</div>
      ${managing ? `<button type="button" class="drawer-primary" id="colCreate">创建合集</button>` : `<button type="button" class="drawer-primary" id="colUse">确定</button>`}`;
    const manage = sheet.querySelector("#colManage");
    if (manage) manage.addEventListener("click", () => { view = "manage"; paint(); });
    const done = sheet.querySelector("#colDone");
    if (done) done.addEventListener("click", () => { view = "pick"; paint(); });
    sheet.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("click", () => { pickedCol = Number(btn.dataset.pick); paint(); }));
    sheet.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", () => {
      const id = Number(btn.dataset.del);
      collections = collections.filter(item => item.id !== id);
      if (pickedCol === id) { pickedCol = 0; setOptLabel("collection", "未添加"); }
      toast("已删除合集");
      paint();
    }));
    const create = sheet.querySelector("#colCreate");
    if (create) create.addEventListener("click", () => {
      if (collections.length >= 20) { toast("合集数量已达到上限"); return; }
      coverUrl = "";
      view = "create";
      paint();
    });
    const use = sheet.querySelector("#colUse");
    if (use) use.addEventListener("click", () => {
      const item = collections.find(col => col.id === pickedCol);
      setOptLabel("collection", item ? item.name : "未添加");
      close();
      toast(item ? "已加入合集" : "未添加合集");
    });
  };
  paint();
}
function openOptionDrawer(key) {
  if (key === "time") return openTimeDrawer();
  if (key === "link") return openLinkDrawer();
  if (key === "pay") return openPayDrawer();
  if (key === "collection") return openCollectionDrawer();
  const item = OPTS[key];
  if (!item) return;
  const { sheet, close } = mountDrawer();
  sheet.innerHTML = `<i class="handle"></i><h3>${item.label}</h3>` + item.choices.map(choice => `<button type="button" class="opt-card${postOpts[key] === choice ? " on" : ""}" data-choice="${choice}">${choice}</button>`).join("");
  sheet.querySelectorAll("[data-choice]").forEach(btn => btn.addEventListener("click", () => {
    const choice = btn.dataset.choice;
    if (key === "bgm" && choice === "从本地上传") {
      close();
      document.getElementById("file").click();
      return;
    }
    setOptLabel(key, choice);
    close();
    toast("已设置" + item.label);
  }));
}

function openSheet(mode) {
  const createOnly = mode === "create";
  const mask = document.createElement("div");
  mask.className = "mask";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `<button type="button" data-mode="article">写短篇</button><button type="button" data-mode="image">发图文</button>${createOnly ? "" : `<button type="button" data-mode="moment">发动态</button><button type="button" data-draft>草稿箱</button>`}<button type="button" class="cancel">取消</button>`;
  const close = () => { mask.remove(); sheet.remove(); };
  mask.addEventListener("click", close);
  sheet.querySelector(".cancel").addEventListener("click", close);
  const draft = sheet.querySelector("[data-draft]");
  if (draft) draft.addEventListener("click", () => { close(); show("drafts", { from: page }); });
  sheet.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { close(); editorCover = ""; editorPics = []; editorMode = b.dataset.mode; show("editor", { from: page }); }));
  screen.append(mask, sheet);
}

tabbar.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-tab]");
  if (!btn || btn.dataset.tab === "plaza") return;
  backTo = btn.dataset.tab;
  if (btn.dataset.tab === "home") homeTab = "推荐";
  show(btn.dataset.tab);
});

document.querySelectorAll("[data-theme]").forEach(btn => btn.addEventListener("click", () => {
  night = btn.dataset.theme === "dark";
  document.querySelectorAll("[data-theme]").forEach(b => b.classList.toggle("on", b === btn));
  if (page === "reader") show("reader");
  else toast(night ? "阅读页已切换夜间模式" : "阅读页已切换日间模式");
}));

function loadFile(file) {
  if (!file) return;
  const ok = (file.type || "").startsWith("audio/") || /\.(mp3|wav|m4a|aac|ogg|flac|webm)$/i.test(file.name);
  if (!ok) { toast("请上传音频文件"); return; }
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  audio.src = objectUrl;
  trackTitle = file.name.replace(/\.[^.]+$/, "");
  postOpts.bgm = trackTitle;
  document.getElementById("fileState").textContent = "已加载：" + trackTitle;
  const bgmLabel = stage.querySelector('[data-opt="bgm"] span');
  if (bgmLabel) bgmLabel.textContent = trackTitle + " ›";
  vinyl.setAttribute("aria-label", "播放或暂停：" + trackTitle);
  toast("音乐已上传");
}
document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", () => loadFile(document.getElementById("file").files[0]));
function syncPlay() {
  const on = !!audio.src && !audio.paused;
  vinyl.classList.toggle("on", on);
  document.getElementById("playBtn").classList.toggle("on", on);
  const label = document.getElementById("fileState");
  label.classList.toggle("playing", on);
  if (audio.src) label.textContent = (on ? "正在播放：" : "已暂停：") + trackTitle;
}
function playMusic() {
  if (!audio.src) { toast("还没有可播放的音乐"); return; }
  audio.play().then(syncPlay).catch(() => toast("这段音频无法播放"));
}
function pauseMusic() { if (audio.src && !audio.paused) { audio.pause(); syncPlay(); } }
document.getElementById("playBtn").addEventListener("click", playMusic);
document.getElementById("pauseBtn").addEventListener("click", pauseMusic);
vinyl.addEventListener("click", () => audio.paused || !audio.src ? playMusic() : pauseMusic());
audio.addEventListener("play", syncPlay);
audio.addEventListener("pause", syncPlay);
audio.addEventListener("ended", syncPlay);

vinyl.style.setProperty("--cover", "url(\"" + TRACK_COVER + "\")");
vinyl.setAttribute("aria-label", "播放或暂停：" + trackTitle);

const params = new URLSearchParams(location.search);
if (params.get("night") === "1") night = true;
show(views[params.get("view")] ? params.get("view") : "home");
</script>
</body>
</html>
