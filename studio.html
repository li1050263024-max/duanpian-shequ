<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短篇测试生成</title>
<style>
  :root {
    --bg: #e7e7ea;
    --card: #fff;
    --ink: #222;
    --muted: #8a8a8a;
    --line: #eee;
    --blue: #3b86e8;
    --soft: #f6f7f9;
    --warn: #9a3412;
    --warnbg: #fff4ed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  .app { height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 0 4px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 750; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header a { color: var(--blue); font-size: 13px; text-decoration: none; }
  .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(300px, 0.7fr) minmax(680px, 1.5fr); background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.06); }
  .col { min-height: 0; display: flex; flex-direction: column; }
  .col + .col { border-left: 1px solid var(--line); }
  .pad { padding: 14px; }
  .search { display: flex; gap: 8px; }
  .search input, .search select, .add select, .controls select, .controls input {
    height: 34px; border: 1px solid #e6e6e6; border-radius: 10px; background: var(--soft); padding: 0 10px; font-size: 13px;
  }
  .search input { flex: 1; min-width: 0; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .filters button, .chip, .add button, .actions button, .seg button {
    border: 1px solid #e6e6e6; background: #fff; border-radius: 999px; height: 28px; padding: 0 10px; font-size: 12px;
  }
  .filters button.on, .chip.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .list { overflow: auto; padding: 0 8px 12px; }
  .item { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 10px; display: block; }
  .item.on { background: #f3f7fd; }
  .item b { display: block; font-size: 14px; line-height: 1.35; }
  .item small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .item i { font-style: normal; color: var(--warn); }
  .scroller { overflow: auto; padding: 16px 18px 28px; }
  .kicker { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  h2 { margin: 0; font-size: 22px; line-height: 1.35; }
  .meta { margin: 8px 0 0; color: #666; font-size: 13px; }
  .banner { margin-top: 12px; background: var(--warnbg); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; }
  .people { margin-top: 12px; font-size: 13px; color: #666; }
  .group { margin-top: 16px; }
  .group h3 { margin: 0 0 8px; font-size: 13px; color: #666; font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.off { color: #aaa; background: #fafafa; }
  .excerpt { margin-top: 16px; padding: 12px; background: var(--soft); border-radius: 12px; color: #555; font-size: 13px; line-height: 1.7; }
  .origin { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.85; color: #222; }
  #right { overflow: auto; }
  .model { border-top: 1px solid var(--line); padding: 12px 14px 18px; background: #fff; }
  .model h3 { margin: 0; font-size: 14px; }
  .model .desc { margin-top: 4px; }
  .model label { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 12px; color: #666; }
  .model input, .model select { height: 34px; border: 1px solid #e6e6e6; border-radius: 10px; background: var(--soft); padding: 0 10px; font-size: 13px; }
  .model-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .model-grid button { height: auto; min-height: 28px; padding: 6px 10px; border: 1px solid #e6e6e6; background: #fff; border-radius: 10px; line-height: 1.3; text-align: left; }
  .model-grid button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .model-id { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .model .actions { padding: 10px 0 0; }
  #modelOut, #revisePrompt { display: block; width: calc(100% - 20px); margin: 8px 10px 0; min-height: 120px; resize: vertical; border: 1px solid #e6e6e6; border-radius: 12px; padding: 12px; background: #fbfbfc; font-size: 14px; line-height: 1.75; }
  #modelOut { height: 360px; min-height: 240px; }
  #revisePrompt { height: 96px; }
  .file-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .file-row label { flex: 1; min-width: 140px; }
  .studio-top { padding: 14px 14px 0; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .desc { margin: 8px 0 0; color: #666; font-size: 12px; line-height: 1.55; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .prompt-label { margin: 12px 10px 0; color: #666; font-size: 12px; }
  .prompt { display: block; width: calc(100% - 20px); margin: 6px 10px 0; min-height: 140px; height: 180px; resize: vertical; border: 1px solid #e6e6e6; border-radius: 12px; padding: 12px; background: #fbfbfc; font-size: 12.5px; line-height: 1.65; }
  .beats { margin: 0 10px 8px; }
  .beat-label { margin: 10px 0 0; color: #666; font-size: 12px; }
  .beat-label b { color: #222; margin-right: 6px; }
  .prompt.beat { width: 100%; height: 84px; min-height: 72px; margin: 4px 0 0; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 14px 10px; }
  .actions .primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .submit-status { font-size: 13px; line-height: 1.4; color: #666; }
  .submit-status.ok { color: #137333; }
  .submit-status.bad { color: #c44747; }
  .draft { margin: 0 14px 16px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff; }
  .draft h3 { margin: 0 0 6px; font-size: 16px; }
  .draft .tagline { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  .draft p { margin: 0 0 8px; font-size: 14px; line-height: 1.75; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px; }
  .dirty { margin: 0 14px 8px; color: var(--blue); font-size: 12px; }
  @media (max-width: 1100px) {
    .shell { grid-template-columns: 1fr; overflow: auto; }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
    .app { height: auto; }
    .list { max-height: 360px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>短篇测试生成</h1>
      <p id="summary">正在读取素材标签…</p>
    </div>
    <div style="display:flex;gap:14px">
      <a href="admin.html">管理后台</a>
      <a href="index.html">返回社区原型</a>
    </div>
  </header>
  <div class="shell">
    <section class="col">
      <div class="pad">
        <div class="search">
          <input id="q" type="search" placeholder="搜标题、标签、关键词" aria-label="搜索素材">
          <select id="sort" aria-label="排序">
            <option value="hot">按热度</option>
            <option value="comments">按评论</option>
          </select>
        </div>
        <div class="filters" id="filters"></div>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section class="col">
      <div class="scroller" id="detail"></div>
    </section>
    <section class="col" id="right">
      <div id="studio"></div>
      <form class="model" id="modelForm">
        <h3>模型选择</h3>
        <p class="desc">走火山方舟同一把 API。选定模型后发送当前提示词，密钥只留在这台浏览器。</p>
        <div class="model-grid" id="modelGrid"></div>
        <p class="model-id" id="modelMeta"></p>
        <label id="apiLabel">方舟 API<input id="apiKey" type="password" placeholder="ark-..." autocomplete="off"></label>
        <div class="actions">
          <button type="button" class="primary" id="sendModel">发送当前提示词</button>
          <button type="button" id="stopModel">停止</button>
        </div>
        <p class="desc" id="modelStatus"></p>
        <label for="modelOut">生成正文</label>
        <textarea id="modelOut" placeholder="生成结果出现在这里，可以直接改"></textarea>
        <label for="revisePrompt">修改优化</label>
        <textarea id="revisePrompt" placeholder="写下要怎么改，例如把某一段写得更近一点，补一处衣着或动作的细节"></textarea>
        <div class="actions">
          <button type="button" id="reviseModel">按提示词修改</button>
        </div>
        <div class="file-row">
          <label>提交人<input id="authorName" maxlength="40" placeholder="你的名字" autocomplete="nickname"></label>
          <label>标题<input id="storyTitle" maxlength="80" placeholder="用正文第一行，也可以自己改"></label>
          <label>同人标签<input id="storyTag" maxlength="80" placeholder="哪个 IP 或人"></label>
        </div>
        <div class="actions">
          <button type="button" id="saveStory">保存</button>
          <button type="button" class="primary" id="submitStory">提交</button>
          <span id="submitStatus" class="submit-status" role="status"></span>
        </div>
      </form>
    </section>
  </div>
</div>
<script src="data/corpus.js"></script>
<script src="data/board.js?v=9"></script>
<script>
const CATS = [
  ["plot", "情节"],
  ["persona", "气质"],
  ["relation", "关系"],
  ["setting", "场景"],
  ["mood", "情绪"],
  ["craft", "写法"],
  ["keywords", "关键词"]
];
const LEADS = ["周屿", "沈析", "陈见", "江衡", "许晏", "林深", "顾迟", "宋衍"];
const TEMPLATES = [
  { id: "frame", name: "热帖骨架", desc: "走向：近距离开场，中间两次靠近又躲开，结尾停在舍不得松手的动作上。" },
  { id: "chase", name: "追妻火葬场", desc: "走向：先写清离开的原因，再写她自己的一段日子，求和是一件具体的事，当天不复合。" },
  { id: "marry", name: "先婚后爱", desc: "走向：结婚有具体理由，三件同住小事把人缠住，结尾是重新选择。" },
  { id: "short", name: "单场景短打", desc: "走向：一个晚上的一件事，话黏在一起，停在几乎越界的地方。" },
  { id: "sweet", name: "甜向日常", desc: "走向：小事引起的吃醋当天解开，结尾是一句只有两个人懂的软话。" },
  { id: "mash", name: "标签混剪", desc: "走向：把情节、关系和场景串成一条线，中间有一次贴上去又停住。" }
];
const PLACE = {
  校园: "大学南门外的梧桐荫里",
  娱乐圈: "通告散场后的地下车库",
  豪门: "老宅那间灯总是偏暗的餐厅",
  医院: "夜班结束的医院侧门",
  公司: "公司楼下的玻璃雨廊",
  机场: "到达厅出口的隔离带外",
  雨夜: "没打伞的屋檐下",
  雪天: "初雪刚盖住台阶的路口",
  婚礼: "婚礼侧厅的消防通道口",
  酒店: "宴会散尽的走廊",
  家乡: "县城汽车站门口",
  高中回忆: "已经改成商业街的旧校门口"
};

const data = window.CORPUS;
const state = {
  q: "",
  plot: "",
  sort: "hot",
  id: "",
  template: "frame",
  manualTemplate: false,
  words: 2500,
  ending: "HE",
  pov: "第一人称",
  tone: "UGC",
  lead: "周屿",
  off: new Set(),
  dirtySystem: false,
  dirtyUser: false,
  seed: 1,
  draft: null
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hotText(n) {
  return n >= 10000 ? (n / 10000).toFixed(1) + "万" : String(n);
}
function story() {
  return data.stories.find(s => s.id === state.id) || null;
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  let rows = data.stories.filter(s => {
    if (state.plot && !(s.tags.plot || []).includes(state.plot)) return false;
    if (!q) return true;
    const blob = [s.title, s.author, ...(s.notes || []), ...(s.keywords || []), ...Object.values(s.tags).flat()].join(" ").toLowerCase();
    return blob.includes(q);
  });
  rows.sort((a, b) => (b[state.sort] || 0) - (a[state.sort] || 0));
  return rows;
}
function activeTags(s) {
  const out = {};
  CATS.forEach(([cat]) => {
    const src = cat === "keywords" ? (s.keywords || []) : (s.tags[cat] || []);
    out[cat] = src.filter(tag => !state.off.has(cat + ":" + tag));
  });
  return out;
}
function pickTemplate(s) {
  const plots = s.tags.plot || [];
  const first = plots[0] || "";
  const mood = (s.tags.mood || []).join(" ");
  if ((s.tags.craft || []).includes("短打")) return "short";
  if (/先婚|联姻|闪婚|隐婚|离婚|复婚|带球/.test(first)) return "marry";
  if (/追妻|破镜|冷战|海王/.test(first)) return "chase";
  if (/沙雕|甜/.test(mood)) return "sweet";
  return "frame";
}
function endingLine() {
  if (state.ending === "BE") return "保留爱意，但这一次没有和好。不惩罚叙述者，也不把伤害写成浪漫。";
  if (state.ending === "开放") return "情绪停在未完成的地方。不写复合成功，也不写彻底决裂。";
  return "关系有明确的靠近。结尾落在一个具体动作上，不用宣誓式告白收束。";
}
function isYouPov() {
  return state.pov === "第二人称" || state.pov === "第三人称";
}
function povLine() {
  if (state.pov === "第二人称") return "人称：第二人称。叙述者是「你」。对方只叫" + state.lead + "。全文用「你」来写。";
  if (state.pov === "第三人称") return "人称：第三人称。叙述者是「你」。对方只叫" + state.lead + "。全文用「你」来写。";
  return "人称：第一人称。用「我」作叙述者。对方只叫" + state.lead + "。";
}
function beatDraft(s) {
  const blank = { qi: "", cheng: "", zhuan: "", he: "" };
  if (!s || s.blocked) return blank;
  const tags = activeTags(s);
  const who = isYouPov() ? "你" : "我";
  const name = state.lead;
  const plot = (tags.plot || []).join("、");
  const place = (tags.setting || []).join("、");
  const scene = place ? "场面放在" + place + "。" : "";
  const core = plot ? "这件事的核心是" + plot + "。" : "";
  const map = {
    frame: {
      qi: core + scene + who + "和" + name + "在很近的距离里开场。",
      cheng: "两人靠近一次，又躲开。用一件小事把关系里的错位写出来。",
      zhuan: "再靠近一次。一件具体的事把关系拧住。",
      he: "停在一个舍不得松手的动作上。"
    },
    chase: {
      qi: core + "写清她离开的具体原因。",
      cheng: "她离开后自己过了一小段日子。",
      zhuan: "他做一件看得见的事来求和，比如改掉还绑着她的安排、当众把话说清，或把她一个人扛过的事接过去。",
      he: "她可以心软，但当天不回到原来的位置。"
    },
    marry: {
      qi: core + "交代结婚的具体理由，家族、合约或各取所需都可以。",
      cheng: "同住里的两件小事把两个人缠到一起。",
      zhuan: "第三件小事改变她看他的方式。如果生活里已经有孩子，孩子只作为在场的事实。",
      he: "她重新做一次选择。"
    },
    short: {
      qi: scene + "只写一个晚上里的一件事，" + who + "和" + name + "已经挨得很近。",
      cheng: "话来回黏着，动作一次比一次近。",
      zhuan: "走到一个几乎越界又停住的地方。",
      he: "这个晚上停在这里，不把以后写完。"
    },
    sweet: {
      qi: core + "一件小事引起吃醋或误会。",
      cheng: "两人围着这件事打转，可以开玩笑。",
      zhuan: "误会在当天被一件具体的小事解开。",
      he: "结尾是一句只有这两个人听得懂的软话。"
    },
    mash: {
      qi: core + scene + who + "和" + name + "相遇。",
      cheng: "顺着关系和场景往下写，让两个人越靠越近。",
      zhuan: "出现一次几乎贴上去又停住的瞬间。两个设定打架时，保留更具体的那个。",
      he: "收在一个还没说完的动作上。"
    }
  };
  const beats = map[state.template] || map.frame;
  if (!isYouPov()) return beats;
  return Object.fromEntries(Object.entries(beats).map(([key, value]) => [key, value.replace(/她/g, "你")]));
}
function buildSystem() {
  return [
    "你是短篇社区的乙女向作者。按用户提示词里的起、承、转、合，写一篇梦女短篇。用户若写了重点，重点必须出现在正文里，优先于起承转合。",
    "",
    "文风：",
    "擦边，黏糊，乙女，梦女。叙述者沉在被偏爱里。对方话软，动作近，叫她的时候舍不得放开。亲密停在呼吸、衣领、手腕、额头和没吻下去的距离。",
    "需要细节描写。衣着、场景、物件、距离和手上的小动作可以写具体，让人站在现场。",
    "多分段。对话单独成段。",
    "",
    "硬性约束：",
    "1. 不复述、不改写任何已有帖子的句子、对白和情节桥段。姓名以用户提示词为准。",
    "2. 恋爱、亲密和擦边只写成年人。不写中学阶段的恋爱和亲密接触。",
    "3. 不做露骨的性行为描写，不写裸露和器官。",
    "4. 人称、对方姓名、篇幅、结局和起承转合，全部以用户提示词为准。用户没写的节点不要自行加一条大支线。",
    "5. 用户写了重点时，重点必须出现在正文里，优先于起承转合。",
    "",
    "输出：",
    "第一行只写标题。",
    "空一行后写正文。",
    "不要写创作说明，不要写标签列表。"
  ].join("\n");
}
function buildUserPrompt(s) {
  if (!s) return "";
  if (s.blocked) return "这篇素材不进入生成。\n" + s.blockReason;
  const tags = activeTags(s);
  const tone = state.tone === "PGC"
    ? "句子收干净，少用网络口头禅。段落仍然要短。"
    : "可以有口语、撒娇和没说完的半句。";
  const keywords = (tags.keywords || []).slice(0, 4);
  const beats = beatDraft(s);
  const focus = (document.getElementById("beatFocus")?.value || "").trim();
  const lines = [
    povLine(),
    "篇幅：大约 " + state.words + " 字。",
    "结局：" + state.ending + "。" + endingLine(),
    "口气：" + tone,
    "",
    "起：" + beats.qi,
    "承：" + beats.cheng,
    "转：" + beats.zhuan,
    "合：" + beats.he
  ];
  if (focus) lines.push("重点：" + focus);
  if (keywords.length) lines.push("可以写成细节的物件：" + keywords.join("、") + "。");
  lines.push("句子都写成新的。不要复述素材原句。");
  return lines.join("\n");
}
function collectUserPrompt() {
  const beats = {
    qi: document.getElementById("beatQi")?.value.trim() || "",
    cheng: document.getElementById("beatCheng")?.value.trim() || "",
    zhuan: document.getElementById("beatZhuan")?.value.trim() || "",
    he: document.getElementById("beatHe")?.value.trim() || ""
  };
  const focus = document.getElementById("beatFocus")?.value.trim() || "";
  const whoLine = povLine();
  const tone = state.tone === "PGC"
    ? "句子收干净，少用网络口头禅。段落仍然要短。"
    : "可以有口语、撒娇和没说完的半句。";
  const lines = [
    whoLine,
    "篇幅：大约 " + state.words + " 字。",
    "结局：" + state.ending + "。" + endingLine(),
    "口气：" + tone,
    "",
    "起：" + beats.qi,
    "承：" + beats.cheng,
    "转：" + beats.zhuan,
    "合：" + beats.he
  ];
  if (focus) lines.push("重点：" + focus);
  lines.push("按这四个节点写，没填的节点不要自行扩成一条新支线。");
  lines.push("句子都写成新的。不要复述素材原句。");
  return lines.join("\n");
}

function placeOf(settings) {
  for (const key of settings || []) if (PLACE[key]) return PLACE[key];
  return "街角那家还没打烊的面馆门口";
}
function familyOf(plots) {
  const p = (plots || []).join(" ");
  if (/先婚|联姻|闪婚|隐婚|离婚|复婚|带球/.test(p)) return "marry";
  if (/替身|白月光/.test(p)) return "sub";
  if (/暗恋|青梅|一见钟情|双向/.test(p)) return "crush";
  if (/沙雕|甜/.test(p)) return "sweet";
  return "reunion";
}

function selectStory(id, keepTemplate) {
  const s = data.stories.find(x => x.id === id);
  if (!s) return;
  state.id = id;
  state.off = new Set();
  state.dirtySystem = false;
  state.dirtyUser = false;
  state.draft = null;
  const focus = document.getElementById("beatFocus");
  if (focus) focus.value = "";
  const modelOut = document.getElementById("modelOut");
  if (modelOut) modelOut.value = "";
  const tagInput = document.getElementById("storyTag");
  if (tagInput) tagInput.value = (s.people || []).join("、");
  const modelStatus = document.getElementById("modelStatus");
  if (modelStatus) modelStatus.textContent = "";
  state.ending = s.ending === "BE" ? "BE" : "HE";
  const craft = s.tags.craft || [];
  state.pov = craft.includes("第二人称") ? "第二人称" : craft.includes("第三人称") ? "第三人称" : "第一人称";
  if (!keepTemplate && !state.manualTemplate) state.template = pickTemplate(s);
  if (state.template === "short") state.words = 1500;

}

function download(filename, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

    return "当前账号还不能调用 " + modelId + "。到火山方舟控制台开通这个模型后再试。接口说明：" + message;
  }
  return message || "模型请求失败";
}
function cleanKey(raw) {
  const text = String(raw || "").replace(/[\u200b-\u200d\ufeff]/g, "").trim();
  const found = text.match(/ark-[0-9a-fA-F]+(?:-[0-9a-fA-F]+)+/);
  if (found) return found[0];
  return text.replace(/^bearer\s+/i, "").replace(/^["']|["']$/g, "").trim();
}
function renderModelGrid() {
  const current = currentModel();
  document.getElementById("modelGrid").innerHTML = MODELS.map(m =>
    `<button type="button" data-model="${esc(m.id)}" class="${m.id === current.id ? "on" : ""}">${esc(m.name)}</button>`
  ).join("");
  document.getElementById("modelMeta").textContent = current.vendor + " · " + current.id;
  document.getElementById("apiKey").value = modelState.key || "";
}
function loadModel() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(MODEL_KEY) || "{}"); } catch (err) { saved = {}; }
  const previous = saved.arkKey || saved.key || "";
  if (String(previous).startsWith("ark-")) modelState.key = previous;
  if (MODELS.some(m => m.id === saved.modelId)) modelState.modelId = saved.modelId;
  renderModelGrid();
}
function saveModel() {
  modelState.key = cleanKey(document.getElementById("apiKey").value);
  localStorage.setItem(MODEL_KEY, JSON.stringify({ modelId: modelState.modelId, arkKey: modelState.key }));
}
let modelAbort = null;
let modelReq = 0;
document.getElementById("modelForm").addEventListener("submit", e => e.preventDefault());
document.getElementById("modelGrid").addEventListener("click", e => {
  const btn = e.target.closest("[data-model]");
  if (!btn) return;
  saveModel();
  modelState.modelId = btn.dataset.model;
  renderModelGrid();
  saveModel();
});
document.getElementById("apiKey").addEventListener("change", saveModel);
document.getElementById("stopModel").addEventListener("click", () => {
  modelReq += 1;
  if (modelAbort) modelAbort.abort();
  document.getElementById("modelStatus").textContent = "已停止。";
});
const AUTHOR_KEY = "storygen.author";
let storyRecordId = "";
let storyBoardId = "";
function apiUrl(path) {
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") return path;
  return "http://127.0.0.1:8765" + path;
}
function plainError(raw, modelId) {
  const text = String(raw || "");
  if (/<\s*html|405 Not Allowed/i.test(text)) return "公开页面不接受这个请求。请先在本机运行 python tools/serve.py，生成仍走原来的方舟。";
  return modelId ? modelErrorText(text, modelId) : (text || "没有成功。");
}
function firstLine(text) {
  const line = String(text || "").split(/\n/).map(item => item.trim()).find(Boolean) || "";
  return line.replace(/^标题[:：]\s*/, "").slice(0, 80);
}
function rememberAuthor() {
  const name = document.getElementById("authorName").value.trim();
  if (name) localStorage.setItem(AUTHOR_KEY, name);
}
async function askModel(userPrompt, pendingText) {
  const status = document.getElementById("modelStatus");
  const out = document.getElementById("modelOut");
  const picked = currentModel();
  const apiKey = cleanKey(document.getElementById("apiKey").value);
  if (!apiKey) { status.textContent = "先填写方舟 API。"; return ""; }
  document.getElementById("apiKey").value = apiKey;
  saveModel();
  const reqId = ++modelReq;
  if (modelAbort) modelAbort.abort();
  const controller = new AbortController();
  modelAbort = controller;
  status.textContent = pendingText;
  const previous = out.value;
  out.value = "";
  try {
    const res = await fetch(apiUrl("/api/chat"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        baseUrl: picked.base,
        apiKey,
        model: picked.id,
        system: document.getElementById("systemPrompt")?.value || "",
        prompt: userPrompt
      }),
      signal: controller.signal
    });
    if (reqId !== modelReq) return "";
    if (!res.ok) {
      out.value = previous;
      status.textContent = plainError(await res.text(), picked.id);
      return "";
    }
    status.textContent = "已接通，正在写…";
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = "";
    while (true) {
      const step = await reader.read();
      if (reqId !== modelReq) return "";
      if (step.done) break;
      acc += dec.decode(step.value, { stream: true });
      out.value = acc;
    }
    if (reqId !== modelReq) return "";
    const title = document.getElementById("storyTitle");
    if (title && !title.value.trim()) title.value = firstLine(acc);
    status.textContent = acc ? "模型已返回。可以直接改，再保存或提交。" : "模型没有返回正文。";
    return acc;
  } catch (err) {
    if (reqId !== modelReq) return "";
    if (!out.value) out.value = previous;
    if (err.name === "AbortError") status.textContent = "已停止。";
    else status.textContent = "没有连上本机转发。在项目目录运行 python tools/serve.py，然后打开 http://127.0.0.1:8765/studio.html";
    return "";
  }
}
document.getElementById("sendModel").addEventListener("click", () => {
  const s = story();
  const status = document.getElementById("modelStatus");
  if (!s || s.blocked) { status.textContent = "当前素材不进入生成。"; return; }
  const prompt = collectUserPrompt();
  if (!["beatQi", "beatCheng", "beatZhuan", "beatHe"].some(id => document.getElementById(id).value.trim())) {
    status.textContent = "先填写起承转合。";
    return;
  }
  storyRecordId = "";
  storyBoardId = "";
  askModel(prompt, "正在请求模型…");
});
document.getElementById("reviseModel").addEventListener("click", () => {
  const status = document.getElementById("modelStatus");
  const current = document.getElementById("modelOut").value.trim();
  const note = document.getElementById("revisePrompt").value.trim();
  if (!current) { status.textContent = "先有一篇正文，再写修改要求。"; return; }
  if (!note) { status.textContent = "先写下要怎么改。"; return; }
  const prompt = [
    "下面是一篇已经写好的短篇。按修改要求改一版，直接给出改后的全文。",
    "第一行仍然只写标题。",
    "",
    "修改要求：",
    note,
    "",
    "原文：",
    current
  ].join("\n");
  askModel(prompt, "正在按修改要求重写…");
});
function setSubmitStatus(text, kind) {
  const status = document.getElementById("submitStatus");
  status.textContent = text;
  status.className = "submit-status" + (kind ? " " + kind : "");
}
async function storeStory(statusName) {
  const content = document.getElementById("modelOut").value.trim();
  const author = document.getElementById("authorName").value.trim();
  const title = document.getElementById("storyTitle").value.trim() || firstLine(content);
  const tag = document.getElementById("storyTag").value.trim();
  const submitting = statusName === "submitted";
  if (!content) { setSubmitStatus("正文是空的。", "bad"); return; }
  if (submitting && !author) { setSubmitStatus("先填写提交人。", "bad"); return; }
  if (submitting && !tag) { setSubmitStatus("先填写同人标签。", "bad"); return; }
  document.getElementById("storyTitle").value = title;
  rememberAuthor();
  const saveBtn = document.getElementById("saveStory");
  const submitBtn = document.getElementById("submitStory");
  saveBtn.disabled = true;
  submitBtn.disabled = true;
  setSubmitStatus(submitting ? "正在提交…" : "正在保存…", "");
  try {
    const saved = await boardSave({
      _id: storyBoardId,
      id: storyRecordId,
      status: statusName,
      author,
      title,
      tag,
      content
    });
    storyBoardId = saved._id || storyBoardId;
    storyRecordId = saved.id || storyRecordId;
    setSubmitStatus(submitting ? "已提交" : "已保存", "ok");
  } catch (err) {
    setSubmitStatus((err && err.message) || (submitting ? "提交失败" : "保存失败"), "bad");
  } finally {
    saveBtn.disabled = false;
    submitBtn.disabled = false;
  }
}
document.getElementById("saveStory").addEventListener("click", () => storeStory("saved"));
document.getElementById("submitStory").addEventListener("click", () => storeStory("submitted"));
loadModel();
const savedAuthor = localStorage.getItem(AUTHOR_KEY);
if (savedAuthor) document.getElementById("authorName").value = savedAuthor;

if (!data || !data.stories) {
  document.getElementById("summary").textContent = "没有读到 data/corpus.js";
} else {
  document.getElementById("summary").textContent = `已处理 ${data.count} 篇。抽出情节、气质、关系、场景和关键词。${data.blocked} 篇含不宜生成的内容，只保留标签。提示词使用原创角色。`;
  const first = data.stories.find(s => !s.blocked && (s.tags.plot || []).length) || data.stories.find(s => !s.blocked) || data.stories[0];
  selectStory(first.id);
}
</script>
