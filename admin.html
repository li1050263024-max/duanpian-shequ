<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿管理</title>
<style>
  :root { --bg: #e7e7ea; --card: #fff; --ink: #222; --muted: #8a8a8a; --line: #eee; --blue: #3b86e8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .app { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  a { color: var(--blue); font-size: 13px; text-decoration: none; }
  .nav { display: flex; gap: 14px; }
  p.desc { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 16px; overflow: hidden; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  th { color: #666; font-size: 12px; font-weight: 650; background: #fafafa; }
  tr { cursor: pointer; }
  tr:hover td { background: #f7f9fc; }
  .empty { color: var(--muted); padding: 20px; background: var(--card); border-radius: 16px; }
  td.ops { width: 1%; white-space: nowrap; }
  button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid #e6e6e6; background: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  button.danger { border-color: #f0d0d0; color: #c44747; }
  .nav a.on { font-weight: 650; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>投稿管理</h1>
      <p class="desc" id="summary">正在读取提交…</p>
    </div>
    <div class="nav">
      <a href="admin.html" id="tabList">投稿</a>
      <a href="admin.html?bin=1" id="tabBin">回收站</a>
      <a href="studio.html">返回生成面板</a>
    </div>
  </header>
  <div id="list"></div>
</div>
<script>
const onLocalHost = location.hostname === "127.0.0.1" || location.hostname === "localhost";
const apiRoot = onLocalHost ? "" : "http://127.0.0.1:8765";
const bin = new URLSearchParams(location.search).get("bin") === "1";
let canManage = onLocalHost;
document.getElementById(bin ? "tabBin" : "tabList").classList.add("on");
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function when(value) {
  if (!value) return "";
  return String(value).replace("T", " ").slice(0, 16);
}
let items = [];
function summaryText() {
  if (!items.length) return bin ? "回收站是空的。" : "还没有人提交。";
  if (bin) return `回收站有 ${items.length} 篇。可以恢复，或彻底删除。`;
  if (canManage) return `已提交 ${items.length} 篇。双击改正文，删除后进入回收站。`;
  return `已提交 ${items.length} 篇。双击可以查看正文。`;
}
function render() {
  const box = document.getElementById("list");
  document.getElementById("summary").textContent = summaryText();
  if (!items.length) {
    box.innerHTML = `<div class="empty">${bin ? "回收站是空的。" : "还没有提交。"}</div>`;
    return;
  }
  const opsHead = canManage ? "<th></th>" : "";
  const opsCell = item => {
    if (!canManage) return "";
    if (bin) {
      return `<td class="ops"><button type="button" data-action="restore">恢复</button> <button type="button" class="danger" data-action="purge">彻底删除</button></td>`;
    }
    return `<td class="ops"><button type="button" class="danger" data-action="delete">删除</button></td>`;
  };
  box.innerHTML = `<table><thead><tr><th>提交人</th><th>标题</th><th>标签</th><th>时间</th>${opsHead}</tr></thead><tbody>${
    items.map(item => `<tr data-id="${esc(item.id)}"><td>${esc(item.author || "未填")}</td><td>${esc(item.title || "未命名")}</td><td>${esc(item.tag || "")}</td><td>${esc(when(item.deletedAt || item.updatedAt || item.createdAt))}</td>${opsCell(item)}</tr>`).join("")
  }</tbody></table>`;
}
document.getElementById("list").addEventListener("dblclick", e => {
  if (e.target.closest("button")) return;
  const row = e.target.closest("[data-id]");
  if (!row || bin) return;
  location.href = "admin-edit.html?id=" + encodeURIComponent(row.dataset.id);
});
document.getElementById("list").addEventListener("click", async e => {
  const btn = e.target.closest("[data-action]");
  if (!btn || !canManage) return;
  const row = btn.closest("[data-id]");
  if (!row) return;
  const id = row.dataset.id;
  const action = btn.dataset.action;
  const item = items.find(rowItem => rowItem.id === id);
  const name = item && item.title ? item.title : "这篇";
  if (action === "delete" && !confirm(`把「${name}」放进回收站？`)) return;
  if (action === "purge" && !confirm(`彻底删除「${name}」？回收站里也不会留下。`)) return;
  btn.disabled = true;
  try {
    const res = await fetch(apiRoot + "/api/submissions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, action })
    });
    const raw = await res.text();
    if (!res.ok) {
      document.getElementById("summary").textContent = raw || "没有完成。";
      btn.disabled = false;
      return;
    }
    items = items.filter(rowItem => rowItem.id !== id);
    render();
  } catch (err) {
    document.getElementById("summary").textContent = "没有连上本机转发。";
    btn.disabled = false;
  }
});
function applyRows(data) {
  const rows = Array.isArray(data) ? data : (data.items || []);
  items = rows.filter(item => bin ? item.status === "deleted" : (!item.status || item.status === "submitted"));
  render();
}
function showOffline() {
  canManage = false;
  document.getElementById("summary").textContent = bin
    ? "回收站要连着本机转发。先运行 python tools/serve.py。"
    : (onLocalHost ? "没有连上本机转发。先运行 python tools/serve.py，再打开 http://127.0.0.1:8765/admin.html" : "还没有公开的投稿。");
  document.getElementById("list").innerHTML = `<div class="empty">${bin || onLocalHost ? "管理后台要跟生成面板用同一个地址打开。" : "还没有提交。"}</div>`;
}
const liveUrl = apiRoot + "/api/submissions" + (bin ? "?status=deleted" : "");
fetch(liveUrl).then(res => {
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}).then(data => {
  canManage = true;
  applyRows(data);
}).catch(() => {
  if (onLocalHost || bin) { showOffline(); return; }
  fetch("data/public-submissions.json").then(res => {
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }).then(data => {
    canManage = false;
    applyRows(data);
  }).catch(showOffline);
});
</script>
</body>
</html>
