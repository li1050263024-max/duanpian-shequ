<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑投稿</title>
<style>
  :root { --bg: #e7e7ea; --card: #fff; --ink: #222; --muted: #8a8a8a; --line: #eee; --blue: #3b86e8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  a { color: var(--blue); font-size: 13px; text-decoration: none; }
  p.desc { color: var(--muted); font-size: 13px; }
  form { margin-top: 16px; background: var(--card); border-radius: 16px; padding: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 12px; color: #666; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { border: 1px solid #e6e6e6; border-radius: 10px; background: #fbfbfc; padding: 10px 12px; font-size: 14px; }
  textarea { min-height: 420px; line-height: 1.75; resize: vertical; }
  button { margin-top: 14px; height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; }
  button.danger { margin-left: 8px; background: #fff; color: #c44747; border: 1px solid #f0d0d0; }
  button.quiet { margin-left: 8px; background: #fff; color: #333; border: 1px solid #e6e6e6; }
  .empty { color: var(--muted); padding: 20px; background: var(--card); border-radius: 16px; }
  .ai { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ai h2 { margin: 0; font-size: 16px; }
  .model-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .model-grid button { margin: 0; height: auto; min-height: 28px; padding: 6px 10px; border: 1px solid #e6e6e6; border-radius: 10px; background: #fff; color: #222; }
  .model-grid button.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  #revisePrompt { min-height: 88px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>编辑投稿</h1>
      <p class="desc" id="summary">正在读取这篇…</p>
    </div>
    <a href="admin.html">返回列表</a>
  </header>
  <form id="editor" hidden>
    <label>提交人<input id="author" maxlength="40"></label>
    <label>标题<input id="title" maxlength="80"></label>
    <label>同人标签<input id="tag" maxlength="80"></label>
    <label>正文<textarea id="content"></textarea></label>
    <div class="ai" id="aiPanel">
      <h2>AI 修改</h2>
      <p class="desc" id="modelMeta">模型和密钥留在这台浏览器。</p>
      <div class="model-grid" id="modelGrid"></div>
      <label>方舟 API<input id="apiKey" type="password" placeholder="贴上 ark- 密钥，只留在这台浏览器" autocomplete="off"></label>
      <label>修改提示词<textarea id="revisePrompt" placeholder="自己写下要怎么改"></textarea></label>
      <div>
        <button type="button" id="reviseModel">按提示词修改</button>
        <button type="button" class="quiet" id="stopModel">停止</button>
      </div>
      <p class="desc" id="modelStatus"></p>
    </div>
    <button type="submit" id="save">保存</button>
    <button type="button" class="quiet" id="download">下载 Word</button>
    <button type="button" class="danger" id="remove" hidden>删除</button>
  </form>
  <div class="empty" id="missing" hidden>没有找到这条记录。</div>
</div>
<script src="data/board.js?v=12"></script>
<script src="data/relay.js?v=3"></script>
<script src="data/docx.js?v=1"></script>
<script>
const onLocalHost = location.hostname === "127.0.0.1" || location.hostname === "localhost";
let relayUrl = typeof PUBLIC_RELAY === "string" ? PUBLIC_RELAY : "";
async function refreshRelay() {
  if (onLocalHost) return "";
  try {
    const res = await fetch("data/relay.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (data && data.url) relayUrl = String(data.url).replace(/\/$/, "");
    }
  } catch (err) {}
  return relayUrl;
}
refreshRelay();
function chatUrl() {
  return (onLocalHost ? "" : (relayUrl || (typeof PUBLIC_RELAY === "string" ? PUBLIC_RELAY : ""))) + "/api/chat";
}
const id = new URLSearchParams(location.search).get("id") || "";
let record = null;
const summary = document.getElementById("summary");
const form = document.getElementById("editor");
const missing = document.getElementById("missing");
function fill(item) {
  document.getElementById("author").value = item.author || "";
  document.getElementById("title").value = item.title || "";
  document.getElementById("tag").value = item.tag || "";
  document.getElementById("content").value = item.content || "";
  document.title = (item.title || "编辑投稿");
  summary.textContent = "正文可以直接改，改完点保存。";
  form.hidden = false;
}
if (!id) {
  summary.textContent = "没有指定记录。";
  missing.hidden = false;
} else {
  function showItem(item, manage) {
    record = item;
    fill(item);
    document.getElementById("aiPanel").hidden = !manage;
    if (!manage) {
      document.getElementById("save").hidden = true;
      document.getElementById("remove").hidden = true;
      summary.textContent = "公开页可以查看这篇。";
    } else {
      document.getElementById("remove").hidden = false;
    }
  }
  boardRows().then(rows => {
    const item = rows.find(row => row.id === id || row._id === id);
    if (!item) throw new Error("missing");
    showItem(item, true);
  }).catch(() => {
    fetch("data/public-submissions.json").then(res => {
      if (!res.ok) throw new Error(String(res.status));
      return res.json();
    }).then(data => {
      const rows = Array.isArray(data) ? data : (data.items || []);
      const item = rows.find(row => row.id === id || row._id === id);
      if (!item) {
        summary.textContent = "没有找到这条记录。";
        missing.hidden = false;
        return;
      }
      showItem(item, false);
    }).catch(() => {
      summary.textContent = "没有找到这篇投稿。";
      missing.hidden = false;
    });
  });
}
document.getElementById("download").addEventListener("click", () => {
  const title = document.getElementById("title").value.trim() || "未命名";
  const filename = title.replace(/[\\/:*?"<>|]/g, " ").trim().slice(0, 80) || "投稿";
  downloadStoriesDocx([{
    author: document.getElementById("author").value.trim(),
    title,
    tag: document.getElementById("tag").value.trim(),
    content: document.getElementById("content").value
  }], filename + ".docx");
});
form.addEventListener("submit", async e => {
  e.preventDefault();
  const content = document.getElementById("content").value.trim();
  const author = document.getElementById("author").value.trim();
  const title = document.getElementById("title").value.trim();
  const tag = document.getElementById("tag").value.trim();
  if (!content) { summary.textContent = "正文是空的。"; return; }
  if (!author) { summary.textContent = "先填写提交人。"; return; }
  if (!tag) { summary.textContent = "先填写同人标签。"; return; }
  summary.textContent = "正在保存…";
  try {
    const saved = await boardSave({
      _id: record && record._id,
      id: record && record.id || id,
      status: "submitted",
      author,
      title,
      tag,
      content,
      createdAt: record && record.createdAt,
      deletedAt: ""
    });
    record = saved;
    summary.textContent = "已保存。";
  } catch (err) {
    summary.textContent = err && err.message ? err.message : "这次修改还没保存。";
  }
});
const MODEL_KEY = "storygen.model";
const ARK = "https://ark.cn-beijing.volces.com/api/v3";
const MODELS = [
  { id: "deepseek-v4-1-flash-261017", name: "DeepSeek V4 Flash", vendor: "DeepSeek", base: ARK },
  { id: "deepseek-v4-pro-ga-260813", name: "DeepSeek V4 Pro", vendor: "DeepSeek", base: ARK },
  { id: "doubao-seed-2-0-pro-260215", name: "豆包 Seed 2.0 Pro", vendor: "豆包", base: ARK },
  { id: "doubao-seed-2-1-pro-260915", name: "豆包 Seed 2.1 Pro", vendor: "豆包", base: ARK },
  { id: "kimi-k3-1-pro-261024", name: "Kimi K3.1 Pro", vendor: "Kimi", base: ARK },
  { id: "glm-5-2-260617", name: "智谱 GLM-5.2", vendor: "智谱", base: ARK }
];
let modelId = MODELS[0].id;
let modelAbort = null;
let modelReq = 0;
function cleanKey(raw) {
  const text = String(raw || "").replace(/[\u200b-\u200d\ufeff]/g, "").trim();
  const found = text.match(/ark-[0-9a-fA-F]+(?:-[0-9a-fA-F]+)+/);
  if (found) return found[0];
  return text.replace(/^bearer\s+/i, "").replace(/^["']|["']$/g, "").trim();
}
function savedModel() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(MODEL_KEY) || "{}"); } catch (err) { saved = {}; }
  const key = cleanKey(saved.arkKey || saved.key || "");
  return {
    key: key.startsWith("ark-") ? key : "",
    modelId: MODELS.some(item => item.id === saved.modelId) ? saved.modelId : MODELS[0].id
  };
}
function currentModel() {
  return MODELS.find(item => item.id === modelId) || MODELS[0];
}
function renderModels() {
  const saved = savedModel();
  modelId = saved.modelId;
  const current = currentModel();
  document.getElementById("modelGrid").innerHTML = MODELS.map(item =>
    `<button type="button" data-model="${item.id}" class="${item.id === current.id ? "on" : ""}">${item.name}</button>`
  ).join("");
  const input = document.getElementById("apiKey");
  if (input && document.activeElement !== input) input.value = saved.key || "";
  document.getElementById("modelMeta").textContent = saved.key
    ? `已使用这台浏览器保存的方舟密钥 · ${current.name}`
    : "把方舟密钥贴在下面。只留在这台浏览器，和生成页共用。";
}
function rememberModel(nextId) {
  const typed = cleanKey(document.getElementById("apiKey").value);
  const key = typed.startsWith("ark-") ? typed : savedModel().key;
  modelId = nextId;
  localStorage.setItem(MODEL_KEY, JSON.stringify({ modelId, arkKey: key }));
  renderModels();
}
function modelErrorText(detail, pickedId) {
  const raw = String(detail || "");
  let message = raw;
  const start = raw.indexOf("{");
  if (start >= 0) {
    try {
      const err = JSON.parse(raw.slice(start)).error || {};
      message = err.message || err.code || raw;
    } catch (err) {}
  }
  if (/<\s*html|405 Not Allowed/i.test(raw)) return "生成暂时没有连上，请稍后再试。";
  if (/\b401\b|AuthenticationError|authentication fails/i.test(raw)) return "方舟拒绝了这把密钥，或当前账号没有开通 " + pickedId + "。";
  if (/not activated|does not exist|not found|未开通|没有开通|AccessDenied|InvalidEndpoint/i.test(raw)) return "当前账号还不能调用 " + pickedId + "。到火山方舟控制台开通后再试。";
  return message || "模型请求失败";
}
document.getElementById("apiKey").addEventListener("change", () => {
  const typed = cleanKey(document.getElementById("apiKey").value);
  const key = typed.startsWith("ark-") ? typed : savedModel().key;
  document.getElementById("apiKey").value = key;
  localStorage.setItem(MODEL_KEY, JSON.stringify({ modelId: savedModel().modelId, arkKey: key }));
  renderModels();
  if (typed && !typed.startsWith("ark-")) document.getElementById("modelStatus").textContent = "密钥需要是 ark- 开头。";
});
document.getElementById("modelGrid").addEventListener("click", e => {
  const btn = e.target.closest("[data-model]");
  if (!btn) return;
  rememberModel(btn.dataset.model);
});
document.getElementById("stopModel").addEventListener("click", () => {
  modelReq += 1;
  if (modelAbort) modelAbort.abort();
  document.getElementById("modelStatus").textContent = "已停止。";
});
document.getElementById("reviseModel").addEventListener("click", async () => {
  const status = document.getElementById("modelStatus");
  const out = document.getElementById("content");
  const note = document.getElementById("revisePrompt").value.trim();
  const current = out.value.trim();
  const typed = cleanKey(document.getElementById("apiKey").value);
  const key = typed.startsWith("ark-") ? typed : savedModel().key;
  const picked = currentModel();
  if (!current) { status.textContent = "正文是空的。"; return; }
  if (!note) { status.textContent = "先写下修改提示词。"; return; }
  if (!key) { status.textContent = "先贴上方舟密钥。"; return; }
  document.getElementById("apiKey").value = key;
  localStorage.setItem(MODEL_KEY, JSON.stringify({ modelId: picked.id, arkKey: key }));
  const reqId = ++modelReq;
  if (modelAbort) modelAbort.abort();
  const controller = new AbortController();
  modelAbort = controller;
  status.textContent = "正在按提示词修改…";
  const previous = out.value;
  try {
    const send = () => fetch(chatUrl(), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        baseUrl: picked.base,
        apiKey: key,
        model: picked.id,
        prompt: ["下面是一篇已经写好的全文。按修改要求改一版，直接给出改后的全文。", "不要加说明。", "", "修改要求：", note, "", "原文：", current].join("\n")
      }),
      signal: controller.signal
    });
    let res;
    try {
      res = await send();
    } catch (err) {
      if (err.name === "AbortError" || onLocalHost) throw err;
      await refreshRelay();
      res = await send();
    }
    if (reqId !== modelReq) return;
    if (!res.ok) {
      status.textContent = modelErrorText(await res.text(), picked.id);
      return;
    }
    status.textContent = "已接通，正在改…";
    out.value = "";
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let acc = "";
    while (true) {
      const step = await reader.read();
      if (reqId !== modelReq) return;
      if (step.done) break;
      acc += dec.decode(step.value, { stream: true });
      out.value = acc;
    }
    if (!acc) out.value = previous;
    status.textContent = acc ? "已改完。看过正文后可以保存。" : "模型没有返回正文。";
  } catch (err) {
    if (reqId !== modelReq) return;
    if (!out.value) out.value = previous;
    status.textContent = err.name === "AbortError" ? "已停止。" : "生成暂时没有连上，请稍后再试。";
  }
});
renderModels();
document.getElementById("remove").addEventListener("click", async () => {
  const title = document.getElementById("title").value.trim() || "这篇";
  if (!confirm(`把「${title}」放进回收站？`)) return;
  summary.textContent = "正在删除…";
  try {
    await boardSave(Object.assign({}, record, {
      status: "deleted",
      deletedAt: new Date().toISOString(),
      author: document.getElementById("author").value.trim(),
      title,
      tag: document.getElementById("tag").value.trim(),
      content: document.getElementById("content").value
    }));
    location.href = "admin.html?bin=1";
  } catch (err) {
    summary.textContent = err && err.message ? err.message : "这次没有放进回收站。";
  }
});
</script>
</body>
</html>
