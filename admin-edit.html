<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑投稿</title>
<style>
  :root { --bg: #e7e7ea; --card: #fff; --ink: #222; --muted: #8a8a8a; --line: #eee; --blue: #3b86e8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .app { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  a { color: var(--blue); font-size: 13px; text-decoration: none; }
  p.desc { color: var(--muted); font-size: 13px; }
  form { margin-top: 16px; background: var(--card); border-radius: 16px; padding: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; font-size: 12px; color: #666; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { border: 1px solid #e6e6e6; border-radius: 10px; background: #fbfbfc; padding: 10px 12px; font-size: 14px; }
  textarea { min-height: 420px; line-height: 1.75; resize: vertical; }
  button { margin-top: 14px; height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; cursor: pointer; }
  .empty { color: var(--muted); padding: 20px; background: var(--card); border-radius: 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>编辑投稿</h1>
      <p class="desc" id="summary">正在读取这篇…</p>
    </div>
    <a href="admin.html">返回列表</a>
  </header>
  <form id="editor" hidden>
    <label>提交人<input id="author" maxlength="40"></label>
    <label>标题<input id="title" maxlength="80"></label>
    <label>同人标签<input id="tag" maxlength="80"></label>
    <label>正文<textarea id="content"></textarea></label>
    <button type="submit" id="save">保存</button>
  </form>
  <div class="empty" id="missing" hidden>没有找到这条记录。</div>
</div>
<script>
const root = (location.hostname === "127.0.0.1" || location.hostname === "localhost") ? "" : "http://127.0.0.1:8765";
const id = new URLSearchParams(location.search).get("id") || "";
const summary = document.getElementById("summary");
const form = document.getElementById("editor");
const missing = document.getElementById("missing");
function fill(item) {
  document.getElementById("author").value = item.author || "";
  document.getElementById("title").value = item.title || "";
  document.getElementById("tag").value = item.tag || "";
  document.getElementById("content").value = item.content || "";
  document.title = (item.title || "编辑投稿");
  summary.textContent = "正文可以直接改，改完点保存。";
  form.hidden = false;
}
if (!id) {
  summary.textContent = "没有指定记录。";
  missing.hidden = false;
} else {
  fetch(root + "/api/submissions").then(res => {
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }).then(data => {
    const item = (data.items || []).find(row => row.id === id);
    if (!item) {
      summary.textContent = "没有找到这条记录。";
      missing.hidden = false;
      return;
    }
    fill(item);
  }).catch(() => {
    summary.textContent = "没有连上本机转发。先运行 python tools/serve.py，再从管理后台双击打开。";
    missing.hidden = false;
  });
}
form.addEventListener("submit", async e => {
  e.preventDefault();
  const content = document.getElementById("content").value.trim();
  const author = document.getElementById("author").value.trim();
  const title = document.getElementById("title").value.trim();
  const tag = document.getElementById("tag").value.trim();
  if (!content) { summary.textContent = "正文是空的。"; return; }
  if (!author) { summary.textContent = "先填写提交人。"; return; }
  if (!tag) { summary.textContent = "先填写同人标签。"; return; }
  summary.textContent = "正在保存…";
  try {
    const res = await fetch(root + "/api/submissions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status: "submitted", author, title, tag, content })
    });
    const raw = await res.text();
    if (!res.ok) {
      summary.textContent = /<\s*html|405 Not Allowed/i.test(raw) ? "这次修改还没保存。请打开 http://127.0.0.1:8765/admin.html" : (raw || "没有保存成功。");
      return;
    }
    summary.textContent = "已保存。";
  } catch (err) {
    summary.textContent = "没有连上本机转发，这次修改还没保存。";
  }
});
</script>
</body>
</html>
